services:
    argentina_gateway:
        build: .
        image: payments
        container_name: argentina_gateway
        hostname: argentina_gateway
        restart: always
        env_file:
            - .env
        volumes:
            - ./services/argentina_gateway:/service
        command: python3 /service/service.py
        ports:
            - 5000:5000

    argentina_gateway_db:
        image: mysql
        container_name: argentina_gateway_db
        hostname: argentina_gateway_db
        restart: always
        environment:
            - MYSQL_ROOT_PASSWORD=$DB_ARGENTINA_GATEWAY_PASS
        ports:
            - 3306:3306
        volumes:
            - ./bin/arg_gateway.sql:/docker-entrypoint-initdb.d/init.sql

    brazillian_gateway:
        build: .
        image: payments
        container_name: brazillian_gateway
        hostname: brazillian_gateway
        restart: always
        env_file:
            - .env
        volumes:
            - ./services/brazillian_gateway:/service
        command: python3 /service/service.py
        ports:
            - 5001:5000

    brazillian_gateway_db:
        image: mysql
        container_name: brazillian_gateway_db
        hostname: brazillian_gateway_db
        restart: always
        environment:
            - MYSQL_ROOT_PASSWORD=$DB_ARGENTINA_GATEWAY_PASS
        ports:
            - 3307:3306
        volumes:
            - ./bin/br_gateway.sql:/docker-entrypoint-initdb.d/init.sql

    payment_processor:
        build: .
        image: payment_processor
        container_name: payment_processor
        hostname: payment_processor
        restart: always
        env_file:
            - .env
        volumes:
            - ./services/payment_processor:/service
        command: python3 /service/service.py
        ports:
            - 5002:5000

    payment_processor_db:
        image: mysql
        container_name: payment_processor_db
        hostname: payment_processor_db
        restart: always
        environment:
            - MYSQL_ROOT_PASSWORD=$DB_PAYMENT_PROCESSOR_PASS
        ports:
            - 3308:3306
        volumes:
            - ./bin/payment_processor.sql:/docker-entrypoint-initdb.d/init.sql